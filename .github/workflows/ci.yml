name: Проверки

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # stable — то, что программа сама докачивает пользователям;
        # master — чтобы узнать о поломке совместимости раньше пользователей.
        ffmpeg: [n8.1-latest-linux64-gpl-8.1, master-latest-linux64-gpl]
    env:
      MEDIAMTX_VERSION: v1.15.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ffmpeg (${{ matrix.ffmpeg }})
        run: |
          curl -sSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-${{ matrix.ffmpeg }}.tar.xz" \
            | tar xJ --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          ffmpeg -hide_banner -version | head -1
      - name: MediaMTX
        # Сервер ищет компонент под именем из Windows-сборки.
        run: |
          curl -sSL "https://github.com/bluenviron/mediamtx/releases/download/${MEDIAMTX_VERSION}/mediamtx_${MEDIAMTX_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C tools mediamtx
          mv tools/mediamtx tools/mediamtx.exe
      - run: npm ci
      - run: npm run check
      - run: npm test
