name: Проверки

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # stable — то, что программа сама докачивает пользователям;
        # master — чтобы узнать о поломке совместимости раньше пользователей.
        ffmpeg: [n8.1-latest-linux64-gpl-8.1, master-latest-linux64-gpl]
    env:
      MEDIAMTX_VERSION: v1.15.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ffmpeg (${{ matrix.ffmpeg }})
        run: |
          curl -sSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-${{ matrix.ffmpeg }}.tar.xz" \
            | tar xJ --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          ffmpeg -hide_banner -version | head -1
      - name: MediaMTX
        # Сервер ищет компонент под именем из Windows-сборки.
        run: |
          curl -sSL "https://github.com/bluenviron/mediamtx/releases/download/${MEDIAMTX_VERSION}/mediamtx_${MEDIAMTX_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C tools mediamtx
          mv tools/mediamtx tools/mediamtx.exe
      - run: npm ci
      - run: npm run check
      - run: npm test

  build-windows:
    # Собирает весь EXE так же, как по инструкции в README. Подписи здесь нет —
    # сертификат живёт только у того, кто выпускает релизы (tools/sign.ps1).
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: npm ci
      - run: npm run test:unit
      - name: Звук (C#)
        run: |
          dotnet publish audio-helper/VRCast.AudioCapture.csproj -c Release -o audio-helper/bin/publish
          copy audio-helper\bin\publish\VRCast.AudioCapture.exe tools\
      - name: Захват окна (Rust)
        run: |
          cargo build --release --manifest-path capture-helper/Cargo.toml
          copy capture-helper\target\release\vrcast-window-capture.exe tools\VRCast.WindowCapture.exe
      - name: plink
        run: Invoke-WebRequest -Uri https://the.earth.li/~sgtatham/putty/latest/w64/plink.exe -OutFile tools\plink.exe -UseBasicParsing
      - name: Лаунчер
        run: dotnet publish launcher/VRCastBridge.Launcher.csproj -c Release -o launcher/bin/publish
      - uses: actions/upload-artifact@v4
        with:
          name: VRCast-Bridge-unsigned
          path: launcher/bin/publish/VRCast Bridge.exe
